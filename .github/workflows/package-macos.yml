name: Package (macOS)

# Dispatch manual apenas, e sem publish. Este job baixa o DMG oficial da
# Anysphere e monta um artefato derivado; nao existe release, feed de update nem
# assinatura. Enquanto nao houver decisao juridica sobre distribuicao, o
# resultado fica retido como artefato do Actions.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo deste empacotamento"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Empacota e verifica (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          lfs: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache do runtime Electron
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-42.1.0

      # Chave derivada do SHA-256 fixado do DMG: se o pin mudar, o cache cai sozinho.
      - name: Cache do DMG fixado
        uses: actions/cache@v4
        with:
          path: apps/desktop/.cache/downloads
          key: grokbot-dmg-a253ccd8aab01e083f9812a0264354c5034d8ba7f0610bbb557e82ae77d203eb

      # A URL fixada do upstream respondeu 403 em 2026-08-31, tanto do CI quanto
      # de IP residencial. Sem esta checagem, o bootstrap falha com um stack
      # trace de HTTP 403 que nao explica nada a quem le o log.
      # Ver docs/fork/UPSTREAM-WATCH.md.
      - name: Confirma que o artefato fixado esta acessivel
        run: |
          if ls apps/desktop/.cache/downloads/*.dmg >/dev/null 2>&1; then
            echo "Copia local encontrada no cache; segue sem rede."
            exit 0
          fi
          url='https://downloads.cursor.com/grokbot/stable/darwin-arm64/0.18.0/Grok_Bot_0.18.0.dmg'
          code=$(curl -sS -o /dev/null -w '%{http_code}' -r 0-0 "$url" || echo 000)
          if [ "$code" = "200" ] || [ "$code" = "206" ]; then
            echo "Artefato acessivel (HTTP $code)."
            exit 0
          fi
          echo "::error::O artefato 0.18.0 fixado respondeu HTTP $code, e nao ha copia em cache."
          echo "::error::Empacotar exige trazer o artefato: GROK_BOT_018_APP apontando para uma"
          echo "::error::copia instalada, ou o DMG em apps/desktop/.cache/downloads/."
          echo "::error::Este repositorio nao hospeda o binario. Ver docs/fork/UPSTREAM-WATCH.md."
          exit 1

      - name: Bootstrap
        run: pnpm --filter @pingdopong/desktop run bootstrap

      - name: Package
        run: pnpm --filter @pingdopong/desktop run package

      - name: Verify
        run: pnpm --filter @pingdopong/desktop run verify

      - name: Publica o artefato no Actions (nao e release)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: desktop-macos-arm64
          path: apps/desktop/dist/
          retention-days: 7
